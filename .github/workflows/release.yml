# 發布流程：推 semver tag（如 v0.5.0）→ 版本一致性關卡 → 全測試 →
# 雙平台建置並發成 GitHub release（草稿，人工檢視後手動 publish）。
# 產物走內建 GITHUB_TOKEN，零長期密鑰（first-release 精神）。
# 個資紀律：CI 僅用去識別化 fixtures，一律不得引用個資目錄。
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要發布的版本 tag（如 v0.5.0，須與 manifest 版本一致）"
        required: true

permissions:
  contents: write # 建立 release 需寫入權限

jobs:
  # 版本三方一致關卡：tag 版本 == tauri.conf.json == package.json == Cargo.toml
  version-gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 版本一致性斷言
        id: check
        run: |
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${RAW#v}"
          echo "tag 版本＝$VER"
          fail=0
          grep -q "\"version\": \"$VER\"" app/src-tauri/tauri.conf.json || { echo "tauri.conf.json 版本不符"; fail=1; }
          grep -q "\"version\": \"$VER\"" app/package.json || { echo "package.json 版本不符"; fail=1; }
          grep -q "^version = \"$VER\"" app/src-tauri/Cargo.toml || { echo "Cargo.toml 版本不符"; fail=1; }
          grep -q "## $VER" CHANGELOG.md || { echo "CHANGELOG 缺 $VER 段落"; fail=1; }
          [ "$fail" = "0" ] || { echo "::error::版本不一致，發布中止"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  test:
    needs: version-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝 Python 依賴（oracle 端）
        run: pip install pyyaml
      - name: node 測試全套
        working-directory: app
        run: |
          npm ci
          npm test

  release:
    needs: [version-gate, test]
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: npm 依賴
        working-directory: app
        run: npm ci
      - name: Tauri 建置並上傳至 release（草稿）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: v${{ needs.version-gate.outputs.version }}
          releaseName: "MyHealthBank v${{ needs.version-gate.outputs.version }}"
          releaseBody: |
            產物未簽章，首次開啟需手動放行。

            - macOS：下載 `.dmg`。DMG 內附「使用說明（請先閱讀）.txt」，
              放行與上手步驟都在裡面；或按住 Control 點 App 圖示 →「開啟」
            - Windows：下載 `.msi` 或 `.exe`，使用說明請一併下載
              `README-Windows.txt`（繁體中文）。SmartScreen 出現時點
              「其他資訊」→「仍要執行」

            完整說明見 README，變更明細見 CHANGELOG。
          releaseDraft: true
          prerelease: false
      # DMG 內附使用說明：Tauri 的 bundle 設定無法附加任意檔案，改在建置後
      # 後處理再覆蓋上傳（同一支腳本已在 app-build.yml 每次推 main 時實跑）
      - name: DMG 內附使用說明並覆蓋上傳（僅 macOS）
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG="$(find app/src-tauri/target -maxdepth 5 -name '*.dmg' -print -quit)"
          [ -n "$DMG" ] || { echo "::error::找不到 DMG 產物"; exit 1; }
          bash scripts/dmg_add_readme.sh "$DMG"
          gh release upload "v${{ needs.version-gate.outputs.version }}" "$DMG" --clobber
      # Windows 安裝檔是單一執行檔，沒有可放說明的容器，改成獨立資產
      # 掛在下載頁（macOS 使用者拿到的是 DMG 內附的那份）
      - name: Windows 使用說明上傳為 release 資產（僅 Windows）
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 資產名稱必須是 ASCII：GitHub 會把 release 資產名的非 ASCII 字元
          # 剝掉（2026-08-12 實測「使用說明-Windows.txt」變成「-Windows.txt」）。
          # 內容明確轉成 CRLF＋UTF-8 BOM，不依賴 runner 的 checkout 設定：
          # 記事本等 Windows 內建工具沒有 BOM 時可能把繁中顯示成亂碼。
          python3 - <<'PY'
          src = open("packaging/windows-readme.txt", encoding="utf-8").read()
          with open("README-Windows.txt", "w", encoding="utf-8-sig", newline="\r\n") as f:
              f.write(src)
          PY
          gh release upload "v${{ needs.version-gate.outputs.version }}" README-Windows.txt --clobber
