# 發布流程：推 semver tag（如 v0.5.0）→ 版本一致性關卡 → 全測試 →
# 雙平台建置並發成 GitHub release（草稿，人工檢視後手動 publish）。
# 產物走內建 GITHUB_TOKEN，零長期密鑰（first-release 精神）。
# 個資紀律：CI 僅用去識別化 fixtures，一律不得引用個資目錄。
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要發布的版本 tag（如 v0.5.0，須與 manifest 版本一致）"
        required: true

permissions:
  contents: write # 建立 release 需寫入權限

jobs:
  # 版本三方一致關卡：tag 版本 == tauri.conf.json == package.json == Cargo.toml
  version-gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 版本一致性斷言
        id: check
        run: |
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${RAW#v}"
          echo "tag 版本＝$VER"
          fail=0
          grep -q "\"version\": \"$VER\"" app/src-tauri/tauri.conf.json || { echo "tauri.conf.json 版本不符"; fail=1; }
          grep -q "\"version\": \"$VER\"" app/package.json || { echo "package.json 版本不符"; fail=1; }
          grep -q "^version = \"$VER\"" app/src-tauri/Cargo.toml || { echo "Cargo.toml 版本不符"; fail=1; }
          grep -q "## $VER" CHANGELOG.md || { echo "CHANGELOG 缺 $VER 段落"; fail=1; }
          [ "$fail" = "0" ] || { echo "::error::版本不一致，發布中止"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  test:
    needs: version-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝 Python 依賴（oracle 端）
        run: pip install pyyaml
      - name: node 測試全套
        working-directory: app
        run: |
          npm ci
          npm test

  release:
    needs: [version-gate, test]
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: npm 依賴
        working-directory: app
        run: npm ci
      # 簽章 Secrets 尚未設定時要能照常出未簽章產物，不能讓 release 直接失敗
      # （Apple Developer Program 帳號還沒下來的期間仍要能發版）。
      # 判斷式讀 env 而非直接展開 secret 到命令列，避免值出現在指令記錄裡。
      - name: 判斷 Apple 簽章 Secrets 是否齊全
        id: signing
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          A_ID: ${{ secrets.APPLE_ID }}
          A_PW: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$CERT" ]     || missing="$missing APPLE_CERTIFICATE"
          [ -n "$CERT_PW" ]  || missing="$missing APPLE_CERTIFICATE_PASSWORD"
          [ -n "$IDENTITY" ] || missing="$missing APPLE_SIGNING_IDENTITY"
          [ -n "$A_ID" ]     || missing="$missing APPLE_ID"
          [ -n "$A_PW" ]     || missing="$missing APPLE_PASSWORD"
          [ -n "$TEAM" ]     || missing="$missing APPLE_TEAM_ID"
          if [ -z "$missing" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "六個 Secrets 齊全，將簽章並公證"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::缺少$missing，本次產物未簽章未公證，macOS 使用者需手動放行"
          fi
      - name: Tauri 建置並上傳至 release（草稿）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # tauri-action 偵測到這些變數才會簽章與公證；未設定時為空字串，
          # Tauri 會照常產出未簽章產物（不會失敗）。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app
          tagName: v${{ needs.version-gate.outputs.version }}
          releaseName: "MyHealthBank v${{ needs.version-gate.outputs.version }}"
          # 放行步驟是「能不能跑起來」的關鍵，release 頁必須自帶完整版，
          # 不要只寫「見 README」
          releaseBody: |
            ### 下載

            - **macOS**：`MyHealthBank_${{ needs.version-gate.outputs.version }}_aarch64.dmg`（Apple Silicon）
            - **Windows**：`MyHealthBank_${{ needs.version-gate.outputs.version }}_x64-setup.exe`
              或 `MyHealthBank_${{ needs.version-gate.outputs.version }}_x64_en-US.msi`，
              使用說明請一併下載 `README-Windows.txt`（繁體中文）

            ### 首次開啟

            ${{ steps.signing.outputs.enabled == 'true' && '- **macOS**：本版已簽章並通過 Apple 公證，直接開啟即可，不需要手動放行。' || '- **macOS**：本版尚未簽章，首次開啟需手動放行：按住 Control 點 App 圖示 →「開啟」（或系統設定 → 隱私權與安全性 → 仍要開啟）；或在終端機執行一次 `xattr -cr /Applications/MyHealthBank.app`' }}
            - **Windows**：安裝檔未經簽章，SmartScreen 出現時點「其他資訊」→「仍要執行」

            DMG 內另附「使用說明（請先閱讀）.txt」，放行與上手步驟都在裡面。

            也可自行建置：`cd app && npm ci && npx tauri build`（需先安裝 Rust）。

            ### 其他

            完整說明見 [README](https://github.com/notoriouslab/myhealthbank#readme)，
            變更明細見 [CHANGELOG](https://github.com/notoriouslab/myhealthbank/blob/main/CHANGELOG.md)。
          releaseDraft: true
          prerelease: false
      # 簽章與公證的驗收：公證失敗時 DMG 照樣產得出來，只是使用者打不開，
      # 沒有這道斷言就只能等使用者回報。
      #
      # NEVER 只用 spctl 判定：spctl 的結果取決於執行機器的 Gatekeeper 狀態，
      # 在 `spctl --master-disable` 過的機器上，**完全未簽章**的 App 也會回
      # accepted／exit 0（2026-08-14 本機實測，輸出為 `override=security
      # disabled`）。真正的判準是憑證類型與公證票據，兩者都不看 Gatekeeper。
      - name: 簽章與公證驗收（僅 macOS）
        if: matrix.platform == 'macos-latest' && steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find app/src-tauri/target -maxdepth 6 -name 'MyHealthBank.app' -print -quit)"
          DMG="$(find app/src-tauri/target -maxdepth 5 -name '*.dmg' -print -quit)"
          [ -n "$APP" ] || { echo "::error::找不到 .app 產物"; exit 1; }
          [ -n "$DMG" ] || { echo "::error::找不到 DMG 產物"; exit 1; }
          fail=0

          echo "── 1. 憑證類型必須是 Developer ID Application"
          # Apple Distribution 憑證也簽得過，但那是 App Store 用的，直接分發
          # 會被 Gatekeeper 擋；這裡明確斷言憑證種類而不只是「有簽章」。
          if codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "Authority=Developer ID Application"; then
            echo "  OK"
          else
            echo "::error::未以 Developer ID Application 簽章（adhoc 或憑證類型錯誤）"
            codesign -dv --verbose=4 "$APP" 2>&1 | head -20
            fail=1
          fi

          echo "── 2. 簽章本身必須通過嚴格驗證"
          codesign --verify --deep --strict --verbose=2 "$APP" || { echo "::error::codesign 驗證失敗"; fail=1; }

          echo "── 3. DMG 必須已 staple 公證票據"
          # 未公證時 stapler 明確回報 does not have a ticket stapled to it
          xcrun stapler validate "$DMG" || { echo "::error::DMG 沒有公證票據"; fail=1; }

          echo "── 4. Gatekeeper 評估（僅在該機器啟用評估時才有判定力）"
          if spctl --status 2>&1 | grep -q "assessments enabled"; then
            spctl -a -vvv -t install "$DMG" || { echo "::error::Gatekeeper 拒絕此 DMG"; fail=1; }
          else
            echo "::warning::此 runner 的 Gatekeeper 評估已停用，spctl 無判定力，略過（前三項仍具約束力）"
          fi

          [ "$fail" = "0" ] || { echo "::error::簽章／公證驗收未通過，請勿發布此版"; exit 1; }
          echo "簽章與公證驗收通過"
      # DMG 內附使用說明：Tauri 的 bundle 設定無法附加任意檔案，改在建置後
      # 後處理再覆蓋上傳（同一支腳本已在 app-build.yml 每次推 main 時實跑）
      - name: DMG 內附使用說明並覆蓋上傳（僅 macOS）
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG="$(find app/src-tauri/target -maxdepth 5 -name '*.dmg' -print -quit)"
          [ -n "$DMG" ] || { echo "::error::找不到 DMG 產物"; exit 1; }
          bash scripts/dmg_add_readme.sh "$DMG"
          gh release upload "v${{ needs.version-gate.outputs.version }}" "$DMG" --clobber
      # Windows 安裝檔是單一執行檔，沒有可放說明的容器，改成獨立資產
      # 掛在下載頁（macOS 使用者拿到的是 DMG 內附的那份）
      - name: Windows 使用說明上傳為 release 資產（僅 Windows）
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 資產名稱必須是 ASCII：GitHub 會把 release 資產名的非 ASCII 字元
          # 剝掉（2026-08-12 實測「使用說明-Windows.txt」變成「-Windows.txt」）。
          # 內容明確轉成 CRLF＋UTF-8 BOM，不依賴 runner 的 checkout 設定：
          # 記事本等 Windows 內建工具沒有 BOM 時可能把繁中顯示成亂碼。
          python3 - <<'PY'
          src = open("packaging/windows-readme.txt", encoding="utf-8").read()
          with open("README-Windows.txt", "w", encoding="utf-8-sig", newline="\r\n") as f:
              f.write(src)
          PY
          gh release upload "v${{ needs.version-gate.outputs.version }}" README-Windows.txt --clobber
