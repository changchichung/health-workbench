# 發布流程：推 semver tag（如 v0.5.0）→ 版本一致性關卡 → 全測試 →
# 雙平台建置並發成 GitHub release（草稿，人工檢視後手動 publish）。
# 產物走內建 GITHUB_TOKEN，零長期密鑰（first-release 精神）。
# 個資紀律：CI 僅用去識別化 fixtures，一律不得引用個資目錄。
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要發布的版本 tag（如 v0.5.0，須與 manifest 版本一致）"
        required: true

permissions:
  contents: write # 建立 release 需寫入權限

jobs:
  # 版本三方一致關卡：tag 版本 == tauri.conf.json == package.json == Cargo.toml
  version-gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 版本一致性斷言
        id: check
        run: |
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${RAW#v}"
          echo "tag 版本＝$VER"
          fail=0
          grep -q "\"version\": \"$VER\"" app/src-tauri/tauri.conf.json || { echo "tauri.conf.json 版本不符"; fail=1; }
          grep -q "\"version\": \"$VER\"" app/package.json || { echo "package.json 版本不符"; fail=1; }
          grep -q "^version = \"$VER\"" app/src-tauri/Cargo.toml || { echo "Cargo.toml 版本不符"; fail=1; }
          grep -q "## $VER" CHANGELOG.md || { echo "CHANGELOG 缺 $VER 段落"; fail=1; }
          [ "$fail" = "0" ] || { echo "::error::版本不一致，發布中止"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  test:
    needs: version-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝 Python 依賴（oracle 端）
        run: pip install pyyaml
      - name: node 測試全套
        working-directory: app
        run: |
          npm ci
          npm test

  release:
    needs: [version-gate, test]
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: npm 依賴
        working-directory: app
        run: npm ci
      # 簽章 Secrets 尚未設定時要能照常出未簽章產物，不能讓 release 直接失敗
      # （Apple Developer Program 帳號還沒下來的期間仍要能發版）。
      # 判斷式讀 env 而非直接展開 secret 到命令列，避免值出現在指令記錄裡。
      #
      # 三態判定：全有＝簽章公證；全無＝未簽章版；**部分設定＝硬失敗**。
      # 部分設定時 Tauri 只看憑證三件就簽章、公證缺件時靜默降級，會產出
      # 「簽了章但 Gatekeeper 仍擋」且驗收整步被跳過的產物，比全無更糟。
      # env 別名與 secrets 同名，迴圈清單即是唯一的六件清單（新增第七個
      # secret 只需改 names 一處＋補一行同名 env）。
      - name: 判斷 Apple 簽章 Secrets 是否齊全
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          names="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID"
          missing=""; present=""
          for n in $names; do
            if [ -n "${!n:-}" ]; then
              present="$present $n"
            else
              missing="$missing $n"
            fi
          done
          if [ -z "$missing" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "六個 Secrets 齊全，將簽章並公證"
          elif [ -z "$present" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::簽章 Secrets 全未設定，本次產物未簽章未公證，macOS 使用者需手動放行"
          else
            echo "::error::簽章 Secrets 只設定了一部分（缺$missing）。請補齊六個，或全部移除以發未簽章版；半套設定不出貨。"
            exit 1
          fi
      - name: Tauri 建置並上傳至 release（草稿）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # tauri-action 偵測到這些變數才會簽章與公證；未設定時為空字串，
          # Tauri 會照常產出未簽章產物（不會失敗）。
          # 無條件轉入是安全的：上一步已保證「全有或全無」，部分設定
          # 在到達這裡之前就被硬失敗擋下。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app
          tagName: v${{ needs.version-gate.outputs.version }}
          releaseName: "MyHealthBank v${{ needs.version-gate.outputs.version }}"
          # 放行步驟是「能不能跑起來」的關鍵，release 頁必須自帶完整版，
          # 不要只寫「見 README」
          releaseBody: |
            ### 下載

            - **macOS**：`MyHealthBank_${{ needs.version-gate.outputs.version }}_aarch64.dmg`（Apple Silicon）
            - **Windows**：`MyHealthBank_${{ needs.version-gate.outputs.version }}_x64-setup.exe`
              或 `MyHealthBank_${{ needs.version-gate.outputs.version }}_x64_en-US.msi`，
              使用說明請一併下載 `README-Windows.txt`（繁體中文）

            ### 首次開啟

            ${{ steps.signing.outputs.enabled == 'true' && '- **macOS**：本版已簽章並通過 Apple 公證，直接開啟即可，不需要手動放行。' || '- **macOS**：本版尚未簽章，首次開啟需手動放行：按住 Control 點 App 圖示 →「開啟」（或系統設定 → 隱私權與安全性 → 仍要開啟）；或在終端機執行一次 `xattr -cr /Applications/MyHealthBank.app`' }}
            - **Windows**：安裝檔未經簽章，SmartScreen 出現時點「其他資訊」→「仍要執行」

            DMG 內另附「使用說明（請先閱讀）.txt」，放行與上手步驟都在裡面。

            也可自行建置：`cd app && npm ci && npx tauri build`（需先安裝 Rust）。

            ### 其他

            完整說明見 [README](https://github.com/notoriouslab/myhealthbank#readme)，
            變更明細見 [CHANGELOG](https://github.com/notoriouslab/myhealthbank/blob/main/CHANGELOG.md)。
          releaseDraft: true
          prerelease: false
      # macOS 後處理順序是硬約束：塞說明檔會用 hdiutil 重建映像，DMG 層
      # 簽章與公證票據存在映像 trailer（不在檔案系統裡），重建即歸零。
      # 因此必須「先塞檔 → 重新公證＋staple → 驗收 → 上傳」，驗收與上傳
      # 的才是同一顆完好的最終映像；驗收放在重建之前等於驗一個幾秒後
      # 就被丟棄的檔案。
      - name: 定位 DMG 產物（僅 macOS）
        if: matrix.platform == 'macos-latest'
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          # 先指派再輸出：echo "dmg=$(...)" 的寫法在腳本失敗時 echo 仍
          # 成功，會靜默寫入空值讓這步假綠
          DMG="$(bash scripts/locate_dmg.sh)"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
      # Tauri 的 bundle 設定無法附加任意檔案，改在建置後後處理
      # （同一支腳本已在 app-build.yml 每次推 main 時實跑）
      - name: DMG 內附使用說明（僅 macOS）
        if: matrix.platform == 'macos-latest'
        run: bash scripts/dmg_add_readme.sh "${{ steps.bundle.outputs.dmg }}"
      # Tauri 只對 .app 公證＋staple，從不 staple DMG；重建後的 DMG 自行
      # submit＋staple，離線環境的 Gatekeeper 才驗得過。App 內的簽章與
      # 票據在檔案系統裡，重建不受影響。notarytool 的退件不一定反映在
      # exit code，最終硬判準是下一步驗收的 stapler validate。
      # 簽章 MUST 在公證之前：codesign 改寫映像內容，先公證會使票據失效。
      # DMG 層簽章不是公證的必要條件（未簽章的映像，票據僅由內容建出，
      # stapler validate 照樣通過），但 Apple 建議簽，使用者才能驗證映像
      # 本身未被惡意修改；且未簽章的 DMG 在 Gatekeeper 評估中會回
      # 「no usable signature」（2026-08-17 v0.6.0 首次簽章發布連兩輪紅在
      # 這裡，前三項硬判準全過）。
      # 這個 step MUST 自己建 keychain 匯入憑證：tauri-action 的臨時 keychain
      # 只在它自己的 step 內可見，這裡直接 codesign 會得到
      # 「no identity found」（2026-08-17 實踩）。本機驗證時若預先把憑證放進
      # keychain 再測，就驗不出這個差異——驗證環境 MUST 對準 CI 的乾淨環境。
      - name: DMG 簽章（僅 macOS，簽章版）
        if: matrix.platform == 'macos-latest' && steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          DMG="${{ steps.bundle.outputs.dmg }}"
          KC="$RUNNER_TEMP/dmgsign.keychain"
          KCPW="$(openssl rand -base64 24)"
          P12="$RUNNER_TEMP/dmgsign.p12"
          cleanup() { rm -f "$P12"; security delete-keychain "$KC" 2>/dev/null || true; }
          trap cleanup EXIT
          printf '%s' "$CERT_B64" | openssl base64 -d -A -out "$P12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$P12" -k "$KC" -P "$CERT_PW" -T /usr/bin/codesign -A
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          codesign --force --timestamp --keychain "$KC" --sign "$IDENTITY" "$DMG"
          # 判定命令的輸出先收變數再比對，NEVER 接 pipe（SIGPIPE 假紅）
          DMG_SIGN="$(codesign -dv --verbose=4 "$DMG" 2>&1 || true)"
          case "$DMG_SIGN" in
            *"Authority=Developer ID Application"*) echo "DMG 已簽章" ;;
            *) echo "::error::DMG 簽章後仍驗不到 Developer ID Application"
               printf '%s\n' "$DMG_SIGN"; exit 1 ;;
          esac
      - name: DMG 重新公證並 staple（僅 macOS，簽章版）
        if: matrix.platform == 'macos-latest' && steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          A_ID: ${{ secrets.APPLE_ID }}
          A_PW: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG="${{ steps.bundle.outputs.dmg }}"
          xcrun notarytool submit "$DMG" --apple-id "$A_ID" --password "$A_PW" --team-id "$TEAM" --wait
          xcrun stapler staple "$DMG"
      # 驗收：公證失敗時 DMG 照樣產得出來，只是使用者打不開，沒有這道
      # 斷言就只能等使用者回報。簽章版跑 signed 全套斷言；未簽章版跑
      # unsigned 負向對照（確保驗收機制本身沒退化、產物確實未簽章）。
      # 斷言細節與「NEVER 接 pipe／NEVER 只信 spctl」的理由都在腳本內。
      - name: 簽章與公證驗收（僅 macOS）
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then MODE=signed; else MODE=unsigned; fi
          bash scripts/verify_macos_signing.sh "${{ steps.bundle.outputs.dmg }}" "$MODE"
      - name: 覆蓋上傳最終 DMG（僅 macOS）
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.version-gate.outputs.version }}" "${{ steps.bundle.outputs.dmg }}" --clobber
      # Windows 安裝檔是單一執行檔，沒有可放說明的容器，改成獨立資產
      # 掛在下載頁（macOS 使用者拿到的是 DMG 內附的那份）
      - name: Windows 使用說明上傳為 release 資產（僅 Windows）
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 資產名稱必須是 ASCII：GitHub 會把 release 資產名的非 ASCII 字元
          # 剝掉（2026-08-12 實測「使用說明-Windows.txt」變成「-Windows.txt」）。
          # 內容明確轉成 CRLF＋UTF-8 BOM，不依賴 runner 的 checkout 設定：
          # 記事本等 Windows 內建工具沒有 BOM 時可能把繁中顯示成亂碼。
          python3 - <<'PY'
          src = open("packaging/windows-readme.txt", encoding="utf-8").read()
          with open("README-Windows.txt", "w", encoding="utf-8-sig", newline="\r\n") as f:
              f.write(src)
          PY
          gh release upload "v${{ needs.version-gate.outputs.version }}" README-Windows.txt --clobber
      # 草稿 release 與全部資產在驗收之前就由 tauri-action 建好，驗收
      # 失敗時草稿看起來完整正常（文案還寫著已公證）。這裡把「勿發布」
      # 寫進草稿本體，人工 publish 前第一眼就看得到，不用去翻 Actions。
      - name: 建置或驗收失敗時在草稿標記勿發布（雙平台）
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.version-gate.outputs.version }}"
          # tauri-action 建 release 之前就失敗的話，沒有草稿可標記
          gh release view "$TAG" --json body -q .body > body.md || exit 0
          WARN="> ⚠️ **此草稿的建置或驗收未通過，勿發布。** 詳見本次 Actions 紀錄，修復後重新打 tag。"
          # 已標記過就不重複插（雙平台 matrix 都可能走到這步）
          FIRST_LINE="$(head -1 body.md)"
          case "$FIRST_LINE" in "$WARN"*) exit 0 ;; esac
          { echo "$WARN"; echo; cat body.md; } > body_new.md
          gh release edit "$TAG" --notes-file body_new.md
