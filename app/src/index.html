<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>健康資料工作台</title>
  <link rel="stylesheet" href="./ui/style.css">
</head>
<body>
  <main id="app">
    <header class="topbar">
      <h1>健康資料工作台</h1>
      <div class="profile-switch">
        <label for="profile-select" class="ps-label">成員</label>
        <select id="profile-select" title="切換檢視成員"></select>
        <button id="manage-profiles-btn" type="button" class="btn">管理成員…</button>
      </div>
      <nav class="tabs" role="tablist">
        <button id="tab-btn-import" type="button" role="tab">匯入資料</button>
        <button id="tab-btn-viewer" type="button" role="tab">資料檢視</button>
      </nav>
    </header>
    <p id="status">App 殼啟動中…</p>
    <section id="profile-manager" hidden></section>

    <section id="tab-import" class="tab-panel" hidden>
      <div id="dropzone" role="button" tabindex="0">
        <p class="dz-title">把檔案拖到這裡，或點擊選擇檔案</p>
        <p class="dz-sub">支援健保存摺 JSON／XML、Apple 健康匯出（zip 或 XML）</p>
      </div>
      <div class="toolbar">
        <button id="pick-dir-btn" type="button">選擇 Apple 匯出資料夾…</button>
        <button id="import-db-btn" type="button">匯入既有資料庫檔…</button>
      </div>
      <section id="import-panel" hidden>
        <p id="import-msg" hidden></p>
        <div id="import-confirm" hidden></div>
        <div id="import-progress" hidden>
          <progress id="import-bar" max="100" value="0"></progress>
          <p id="import-progress-text"></p>
        </div>
        <div id="import-report" hidden></div>
      </section>
      <section id="import-history"></section>
    </section>

    <section id="tab-viewer" class="tab-panel" hidden>
      <div class="viewer-head">
        <button id="export-html-btn" type="button" hidden>匯出單檔 HTML…</button>
      </div>
      <p id="viewer-empty">尚無資料。請先到「匯入資料」分頁匯入健保存摺或 Apple 健康匯出檔。</p>
      <iframe id="viewer-frame" title="健康資料儀表板" hidden></iframe>
    </section>
  </main>
  <script type="module" src="./ui/main.js"></script>
</body>
</html>
